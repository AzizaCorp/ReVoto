# REVOTO — configuración; todas las rutas respecto a la raíz del monorepo.
[rutas]
ine_raw = "data/raw/conteos_censales"
ine_staging = "data/staging/ine"
inegi_raw = "data/raw/inegi"
inegi_staging = "data/staging/inegi"
conapo_raw = "data/raw/conapo/pobproy_ggrupos.csv"
conapo_staging = "data/staging/conapo"
geo_raw = "data/raw/geografia"
geo_staging = "data/staging/geo"
processed = "data/processed"
base = "data/revoto.duckdb"
salida = "apps/web/public/data"
reportes = "apps/pipeline/reportes"
mapping_conapo_ine = "data/mappings/conapo_ine.csv"
mapping_inegi_ine = "data/mappings/inegi_ine.csv"
mapping_municipal_historico = "data/mappings/municipios_historicos.csv"
oficiales = "apps/pipeline/revoto_pipeline/validation/cifras_oficiales.csv"
arquetipos_municipales = "data/analisis_arquetipos/arquetipos_municipales.csv"
votos_esperados = "data/analisis_arquetipos/esperado_por_entidad_edad.csv"

[ingestion]
years_ine = [2009, 2012, 2015, 2018, 2021, 2024]
csv_encoding = "utf-8-sig"
threads = 4
memory_limit = "4GB"

[referencia_censal]
"2009" = 2010
"2012" = 2010
"2015" = 2010
"2018" = 2020
"2021" = 2020
"2024" = 2020

[referencia_distritacion_local]
"2009" = 2021
"2012" = 2021
"2015" = 2021
"2018" = 2021
"2021" = 2021
"2024" = 2023

[geografia]
inegi_marco_anio = 2024
inegi_entidades = "inegi/00ent.shp"
inegi_municipios = "inegi/00mun.shp"
inegi_localidades = "inegi/00l.shp"
secciones_dir = "secciones/{anio}"
distritos_locales_dir = "distritos-locales/{anio}"
secciones_archivo = "SECCION.shp"
distritos_locales_archivo = "DISTRITO_LOCAL.shp"
geojson_simplify_degrees = 0.002

[integracion]
incluir_inegi = true
incluir_conapo = true
incluir_geografia = true
# Conservador: no usar puntos representativos para adjudicar toda la población local.
permitir_localidades_por_punto = false
cobertura_minima_inegi = 0.80

[ine]
# Afecta marts/publicación; el raw y los facts canónicos retienen DEL/DEF.
incluir_del = true
# Activar solo tras validar que DEL codifica distrito local en todos los años publicados.
del_distrito_verificado = true

[publicacion]
# RN-02 del contrato actual no autoriza secciones; habilitar sólo después de actualizar
# packages/contracts y aprobar revisión legal/privacidad (RN-05).
publicar_secciones = false
# La forma JSON v2 es distinta a packages/contracts/src/l4.ts; optar explícitamente.
# No publicar JSON v2 directamente: incompatibilidad con L4
permitir_contrato_v2 = false
# Cambiar a true solo después de revisión del equipo y RN-05.
contrato_l4_aprobado = true
umbral_rn05_aprobado = true
publicar_distritos = false
publicar_desgloses_territoriales = false
# Activar UNICAMENTE en el mismo PR en que se actualizan types, schemas y mapeadores.
extensiones_l4_aprobadas = false

[reglas]
umbral_rn05 = 50
max_diferencia_pp = 1.0
